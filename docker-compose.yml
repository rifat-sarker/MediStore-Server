services:
  postgres:
    image: postgres:16-alpine
    container_name: medistore-postgres
    restart: always
    environment:
      POSTGRES_USER: rifat
      POSTGRES_PASSWORD: rifat123
      POSTGRES_DB: medistore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifat -d medistore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medistore-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: medistore-server:latest
    container_name: medistore-server
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: "5001"
      DATABASE_URL: "postgresql://rifat:rifat123@postgres:5432/medistore"
      REDIS_URL: "redis://redis:6379"
      FRONTEND_URL: "http://localhost:3000"
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-2d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-5d}
      CLOUDINARRY_CLOUD_NAME: ${CLOUDINARRY_CLOUD_NAME}
      CLOUDINARRY_API_SECRET: ${CLOUDINARRY_API_SECRET}
      CLOUDINARRY_API_KEY: ${CLOUDINARRY_API_KEY}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SSL_STORE_ID: ${SSL_STORE_ID}
      SSL_STORE_PASSWD: ${SSL_STORE_PASSWD}
      SSL_IS_LIVE: ${SSL_IS_LIVE:-false}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    image: medistore-client:latest
    container_name: medistore-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BASE_API: "http://localhost:5001/api/v1"
      INTERNAL_API_URL: "http://server:5001/api/v1"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
